# Deterministic and LLM QA rules and thresholds

deterministic:
  length_ratio:
    min_ratio: 0.45
    max_ratio: 2.20
    severity: "warning"

  numbers_and_dates:
    severity: "critical"

  name_consistency:
    severity: "critical"

  leftover_text:
    different_script:
      min_consecutive_chars: 4
      severity: "warning"
    same_script:
      # Note: Same-script vocabulary detection is a heuristic and can miss morphological variants.
      severity: "warning"
      wordlists:
        hindi_in_marathi: ["नहीं", "हैं", "था", "थी", "होगा", "कहा", "लेकिन", "अगर", "बहुत"]
        marathi_in_hindi: ["नाही", "आहे", "होता", "होती", "म्हणाला", "पण", "जर", "खूप"]

llm_check:
  model_temperature: 0.0
  types:
    - "dropped_plot_point"
    - "tone_drift"
